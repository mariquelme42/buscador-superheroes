<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buscador de superhéroes que consume la SuperHero API">
  <title>Buscador de Superhéroes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <h1 class="header__title">
        <a href="./" class="header__link">Buscador de Superhéroes</a>
      </h1>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Activar modo oscuro" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <main class="container main">
    <!-- BÚSQUEDA -->
    <section class="search" aria-labelledby="search-title">
      <h2 class="section-title" id="search-title">Búsqueda</h2>
      <form class="search__form" id="search-form" novalidate>
        <div class="form-field form-field--grow">
          <label class="form-field__label" for="search-input">Nombre del personaje</label>
          <input class="form-field__control" type="search" id="search-input" name="search"
                 placeholder="Ej: batman, spider, woman..." autocomplete="off" required>
        </div>
        <div class="form-field">
          <label class="form-field__label" for="order-select">Orden</label>
          <select class="form-field__control" id="order-select" name="order">
            <option value="asc">A-Z</option>
            <option value="desc">Z-A</option>
          </select>
        </div>
        <button class="button button--primary search__submit" type="submit">Buscar</button>
      </form>
      <p class="form-error" id="search-error" role="alert" hidden></p>
    </section>

    <!-- DETALLE DEL PERSONAJE -->
    <section class="detail" id="detail" aria-live="polite" hidden></section>

    <!-- RESULTADOS -->
    <section class="results" id="results" aria-labelledby="results-title">
      <h2 class="section-title results__title" id="results-title">
        <span id="results-count">0</span> resultados
      </h2>
      <div class="status" id="status" aria-live="polite"></div>
      <ul class="grid" id="results-grid"></ul>

      <nav class="pagination" id="pagination" aria-label="Paginado de resultados" hidden>
        <button type="button" class="button pagination__button" data-page="first" aria-label="Primera página">«</button>
        <button type="button" class="button pagination__button" data-page="prev" aria-label="Página anterior">‹</button>
        <div class="pagination__info">
          <label for="page-select">Página</label>
          <select class="form-field__control pagination__select" id="page-select"></select>
          <span>de <span id="total-pages">1</span></span>
        </div>
        <button type="button" class="button pagination__button" data-page="next" aria-label="Página siguiente">›</button>
        <button type="button" class="button pagination__button" data-page="last" aria-label="Última página">»</button>
      </nav>
    </section>
  </main>

  <footer class="footer">
    <p class="container footer__text">
      Hecho con <span aria-label="amor">❤️</span> · Datos provistos por
      <a class="footer__link" href="https://superheroapi.com" target="_blank" rel="noopener">SuperHero API</a>
    </p>
  </footer>
</body>
</html>
